<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a4a">
  <title>Drive Home Again</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=11222117">
</head>
<body>
  <!-- ============ MAP SCREEN ============ -->
  <section id="map" class="screen active">
    <header class="map-head">
      <div id="mascot" class="mascot"></div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <p id="bday" class="bday"></p>
      <p id="soundHint" class="sound-hint"></p>
    </header>
    <ol id="stops" class="stops"></ol>
    <div class="loot">
      <div class="loot-row"><span>Bouquet</span><b id="flowerTotal">0</b><span>🌼</span></div>
      <div class="loot-row"><span>Toes hooked</span><b id="toeTotal">0</b><span>🦶</span></div>
      <div class="loot-row"><span>Bikes hit</span><b id="bikeTotal">0</b><span>🚲</span></div>
      <div class="loot-row"><span>Cars totalled</span><b id="carTotal">0</b><span>💥</span></div>
      <div class="bracelet" id="bracelet"></div>
    </div>
    <details class="savebox" id="savebox">
      <summary id="saveTitle"></summary>
      <p id="saveHelp"></p>
      <div class="save-row">
        <input id="saveCode" readonly aria-label="Your save code">
        <button id="copyCode" class="small-btn"></button>
      </div>
      <p id="loadHelp" class="load-help"></p>
      <div class="save-row">
        <input id="loadCode" placeholder="YOJOHN-..." aria-label="Paste a save code" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="loadBtn" class="small-btn"></button>
      </div>
      <p id="saveMsg" class="save-msg"></p>
    </details>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="game" class="screen">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="hud">
        <div class="hud-chip">🌼 <b id="hudFlowers">0</b></div>
        <div class="progress"><div id="progressFill"></div><div id="progressPeng">🐧</div></div>
        <div class="hud-chip">🦶 <b id="hudToes">0</b></div>
      </div>
      <button id="muteBtn" class="mute" aria-label="Sound">🔊</button>
      <button id="quitBtn" class="quit" aria-label="Back to map">✕</button>
      <div id="toasts"></div>
      <div id="banner" class="banner"></div>
      <button id="toeBtn" class="toe-btn"><span>HOOK THE TOE</span><i id="toeTimer"></i></button>
      <div id="feet" class="feet"><div class="feet-art"></div><div id="feetText"></div></div>
      <div id="snack" class="cutscene"><div class="cut-art"></div><p id="snackText"></p></div>
      <div id="memory" class="memory"><div class="memory-card">
        <div class="memory-label" id="memoryLabel"></div>
        <img id="memoryImg" alt="">
        <p id="memoryText"></p>
        <button id="memoryBtn" class="big-btn"></button>
      </div></div>
      <div id="dialog" class="dialog">
        <div class="dialog-box">
          <div class="dialog-peng"></div>
          <p id="dialogText"></p>
          <small>tap to continue</small>
        </div>
      </div>
      <div id="controls" class="controls">
        <button id="leftBtn" class="ctl" aria-label="Steer left">◀</button>
        <button id="rightBtn" class="ctl" aria-label="Steer right">▶</button>
      </div>
      <div id="complete" class="complete">
        <div class="complete-card">
          <h2 id="completeTitle"></h2>
          <div class="complete-stats">
            <div>🌼 <b id="cFlowers">0</b><small>flowers</small></div>
            <div>🦶 <b id="cToes">0</b><small>toes hooked</small></div>
            <div><span id="cCharm"></span><small>new charm</small></div>
          </div>
          <div class="complete-stats" id="cExtra"></div>
          <p id="completeNote" class="note"></p>
          <button id="completeBtn" class="big-btn">Back to the map</button>
        </div>
      </div>
    </div>
  </section>

  <script src="js/lines.js?v=11222117"></script>
  <script src="js/schedule.js?v=11222117"></script>
  <script src="js/art.js?v=11222117"></script>
  <script src="js/engine.js?v=11222117"></script>
  <script src="audio/manifest.js?v=11222117"></script>
  <script src="photos/manifest.js?v=11222117"></script>
  <script src="js/voice.js?v=11222117"></script>
  <script src="js/level-boulder.js?v=11222117"></script>
  <script src="js/level-kenosha.js?v=11222117"></script>
  <script src="js/level-buenavista.js?v=11222117"></script>
  <script src="js/vendor/three.min.js?v=11222117"></script>
  <script src="js/ski3d.js?v=11222117"></script>
  <script src="js/level-wolfcreek.js?v=11222117"></script>
  <script src="js/main.js?v=11222117"></script>
</body>
</html>
